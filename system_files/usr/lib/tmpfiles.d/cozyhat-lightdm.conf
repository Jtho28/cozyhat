# The lightdm RPM ships these /var dirs but no tmpfiles.d entries for them, so on a bootc
# install they don't exist and lightdm (confined as xdm_t) is denied creating them itself.
# systemd-tmpfiles creates them at boot with the correct SELinux labels.
d /var/cache/lightdm    0755 lightdm lightdm -
d /var/lib/lightdm      0755 lightdm lightdm -
d /var/lib/lightdm-data 0755 lightdm lightdm -
